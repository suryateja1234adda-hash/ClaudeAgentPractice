[project]
name = "basictutoragent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "addasuryateja", email = "suryateja1234adda@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "claude-agent-sdk>=0.2.164",
    "ddgs>=9.16.0",
